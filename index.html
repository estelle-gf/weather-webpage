<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Weather webpage</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form">
          <input
            type="search"
            placeholder="Please enter a city . . ."
            required
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>
      <main>
        <div class="weather-app-data">
          <div>
            <h1 class="weather-city">London</h1>
            <p class="weather-description">
              Thursday <strong>17:39</strong> cloudy
              <br />
              Humidity: <strong>72% </strong>, Wind: <strong>5km/h</strong>
            </p>
          </div>
          <div class="weather-temperature-container">
            <div class="weather-icon">⛅</div>
            <div class="weather-temperature-value">
              <strong>12</strong></div>
              <div class="weather-unit">°C</di
            </div>
          </div>
        </div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/estelle-gf" target="_blank"> Estelle G-F</a
        >, code hosted on
        <a href="https://github.com/estelle-gf/weather-webpage" target="_blank">
          Github</a
        >
        and website hosted on
        <a href="https://weather-on-the-web.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
  </body>
</html>
